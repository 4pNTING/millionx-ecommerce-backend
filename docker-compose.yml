services:
  postgres:
    image: postgres:15-alpine
    container_name: millionx_ecommerce_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: millionx_ecommerce
    ports:
      - '${DB_HOST_PORT:-5436}:5432'
    volumes:
      - millionx_ecommerce_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d millionx_ecommerce']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: millionx_ecommerce_redis
    ports:
      - '${REDIS_HOST_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    profiles: ['full']
    build:
      context: .
      dockerfile: Dockerfile
    container_name: millionx_ecommerce_backend
    env_file:
      - .env
    environment:
      DB_HOST: ${DOCKER_DB_HOST:-host.docker.internal}
      DB_PORT: ${DOCKER_DB_PORT:-5432}
      DB_NAME: millionx_ecommerce
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3000
      GRPC_PORT: 9897
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      AUTH_LOGIN_RATE_LIMIT_MAX: ${AUTH_LOGIN_RATE_LIMIT_MAX:-5}
      AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      AUTH_REGISTER_RATE_LIMIT_MAX: ${AUTH_REGISTER_RATE_LIMIT_MAX:-3}
      AUTH_REGISTER_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_REGISTER_RATE_LIMIT_WINDOW_SECONDS:-3600}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${BACKEND_HTTP_PORT:-3001}:3000'
      - '${BACKEND_GRPC_PORT:-9898}:9897'
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  millionx_ecommerce_data:
